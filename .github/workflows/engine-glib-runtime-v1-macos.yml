# INACTIVE REVIEW CANDIDATE. All execution approvals are closed.
name: Diagnose bounded libtextstyle iconv configuration
on:
  push:
    branches:
      - engine-glib-runtime-v1-ci
    paths:
      - 'packaging/glib-runtime-candidate/**'
      - '.github/workflows/engine-glib-runtime-v1-macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepdesk-glib-runtime-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prerequisites:
    if: github.repository == 'Emin-dev/deepdesk' && github.ref == 'refs/heads/engine-glib-runtime-v1-ci' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Execute only the separately approved configure-only diagnostic
        run: /usr/bin/python3 -I packaging/glib-runtime-candidate/stage.py --repository "$GITHUB_WORKSPACE"
      - name: State the configure-only diagnostic boundary
        if: success()
        run: |
          printf '%s\n' \
            'The configure-only diagnostic completed and emitted fixed iconv configuration observations.' \
            'It stopped before libtextstyle make; no libtextstyle/gettext-tools/GLib runtime success is claimed.' \
            'Unknown or rejected diagnostic facts remain inconclusive; job completion is not a repaired native build.' \
            'The source-libffi executable closure and every Pango/rendering/font/relocation/release check remain unproven.' \
            'No paid runner, cache, uploaded artifact, explicit codesign, personal identity, model or provider query was used.' >> "$GITHUB_STEP_SUMMARY"
