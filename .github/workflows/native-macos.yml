# Native source, mock-core, relocated bundle resources and synthetic-UI verification.
# No production app launch, upstream Python, model, signing secrets or upload.
name: Verify native Deepdesk
on:
  push:
    branches:
      - native-swiftui-ci
    paths:
      - 'native-client/**'
      - '.github/workflows/native-macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepdesk-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'Emin-dev/deepdesk' && github.ref == 'refs/heads/native-swiftui-ci' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify host and toolchain
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Native core tests
        run: swift test --package-path native-client
      - name: Compile native executable without launching
        run: swift build --package-path native-client --configuration release --arch arm64
      - name: Verify native resources in a relocated unsigned app
        run: bash native-client/scripts/test-relocated-resources.sh "$RUNNER_TEMP/deepdesk-relocated-resources"
      - name: Exercise isolated synthetic native UI
        run: bash native-client/UIHarness/run-ui-tests.sh "$RUNNER_TEMP/deepdesk-synthetic-ui"
      - name: Emit bounded synthetic screenshot receipts to public job logs
        if: always()
        continue-on-error: true
        run: python3 native-client/UIHarness/export-synthetic-screenshots.py "$RUNNER_TEMP/deepdesk-synthetic-ui/SyntheticUI.xcresult"
      - name: State validation boundaries
        run: |
          printf '%s\n' \
            'Swift mock tests, native compilation, relocated unsigned-app resource checks and synthetic UI tests completed.' \
            'Only the resource smoke executable and isolated synthetic UI host were launched; the production app, Python engine, inference runtime and models were not executed.' \
            'Bundled integration, real research, Keychain, full accessibility, DMG and Gatekeeper tests remain unverified.' \
            'No binary was uploaded. This job does not provide a download.' >> "$GITHUB_STEP_SUMMARY"

# A separate full DMG workflow would require a new review after:
# - reviewed hash-locked macOS arm64 wheelhouse/build environment exists;
# - readonly-themes.patch and managed-ddg-defaults.patch are applied/tested;
# - engine-provenance.json records verified hashes and review;
# - freeze-engine.sh and build-dmg.sh have succeeded on the actual inputs;
# - a no-spend artifact handback is verified (quota or authorized release).
# No paid/larger runner, write token, persistent credential, or security grant is
# a fallback when these gates are missing.
