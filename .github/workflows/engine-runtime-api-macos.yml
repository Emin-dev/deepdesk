# Candidate only; requires a separate exact full-runtime review and approval.
name: Validate Deepdesk installed runtime API
on:
  push:
    branches:
      - engine-runtime-api-ci
    paths:
      - 'packaging/engine-ci/**'
      - 'packaging/engine_entry.py'
      - 'packaging/patches/**'
      - 'research/engine-ci/**'
      - '.github/workflows/engine-runtime-api-macos.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepdesk-runtime-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-runtime-api:
    if: github.repository == 'Emin-dev/deepdesk' && github.ref == 'refs/heads/engine-runtime-api-ci' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify standard arm64 host
        run: |
          test "$(uname -m)" = arm64
          test -x /usr/bin/sandbox-exec
          sw_vers
          df -h "$RUNNER_TEMP"
      - name: Separately reviewed complete-runtime and synthetic API validation
        run: python3 -I packaging/engine-ci/runtime_api_stage.py --repository "$GITHUB_WORKSPACE" --review-receipt packaging/engine-ci/runtime-review-receipt.json
      - name: Record precise validation boundary
        if: success()
        run: |
          printf '%s\n' \
            'Complete reviewed wheelhouse installed offline, including an explicit separate official PyPI Torch input.' \
            'Real installed engine auth/session/CSRF/encrypted persistence and synthetic report API checks passed.' \
            'No research generation, provider query, model load, native standalone bundle, PDF/libmagic export, signing, DMG or release was tested.' \
            'No cache or artifacts were uploaded. Exact same-run source-wheel and runtime-lock hashes are in logs.' >> "$GITHUB_STEP_SUMMARY"
