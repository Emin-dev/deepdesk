name: Diagnose Deepdesk nested offline sandbox
on:
  push:
    branches:
      - engine-sandbox-diagnostic-ci
    paths:
      - 'packaging/engine-ci/diagnose_nested_sandbox.py'
      - 'packaging/engine-ci/nested-sandbox-review-receipt.json'
      - 'packaging/engine-ci/sandbox-diagnostic-macos.yml.template'
      - '.github/workflows/engine-sandbox-diagnostic-macos.yml'
permissions:
  contents: read
concurrency:
  group: deepdesk-sandbox-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nested-profile-diagnostic:
    if: github.repository == 'Emin-dev/deepdesk' && github.ref == 'refs/heads/engine-sandbox-diagnostic-ci' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Classify single and nested profiles using only system true
        run: python3 -I packaging/engine-ci/diagnose_nested_sandbox.py --repository "$GITHUB_WORKSPACE" --review-receipt packaging/engine-ci/nested-sandbox-review-receipt.json
